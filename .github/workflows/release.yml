name: Release

# Push a tag equal to the version in manifest.json (e.g. 0.1.0, no "v") to publish a
# BRAT-compatible GitHub release with main.js, manifest.json and styles.css.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build

      - name: Check tag matches manifest.json and versions.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $MANIFEST. Use 'npm version <x.y.z>' to bump both."
            exit 1
          fi
          node -e "const v=require('./versions.json'); if(!v['$TAG']) { console.error('versions.json has no entry for $TAG'); process.exit(1) }"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" main.js manifest.json styles.css \
            --title "$TAG" \
            --notes "Install or update with BRAT (see INSTALL-IOS.md). Assets: main.js, manifest.json, styles.css." \
            $PRERELEASE
