name: Deploy docs site and OAuth callback page

# Publishes the GitHub Pages site https://<user>.github.io/<repo>/ :
#   - the guide (README.md -> index), SETUP.md, INSTALL-IOS.md
#   - callback/index.html, the Google sign-in callback page (copied byte-for-byte)
# Rebuilt on every push to main that changes any of them, so the site always
# matches the repository. Source code is never published (see _config.yml).
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions" (see SETUP.md).
# Until that is done, this workflow skips the deploy with a warning instead of failing.
on:
  push:
    branches: [main]
    paths: ["**.md", "callback/**", "_config.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null); then
            if [ "$build_type" = "workflow" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning title=GitHub Pages source::Pages is set to build from a branch. Change Settings -> Pages -> Source to 'GitHub Actions', then re-run this workflow."
          else
            echo "::warning title=GitHub Pages is not enabled::Turn it on in Settings -> Pages -> Source: 'GitHub Actions', then re-run this workflow (Actions -> Deploy OAuth callback page -> Run workflow). Skipping deploy."
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # GitHub's own Pages builder (same as "Deploy from a branch"): renders the
      # Markdown with the Primer theme, fixes links between pages, keeps the
      # callback page unchanged.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check the callback page was published unchanged
        run: |
          cmp callback/index.html _site/callback/index.html
          test -f _site/index.html && grep -q "Complete setup guide" _site/index.html
          ! test -e _site/src && ! test -e _site/main.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
